function curveOf(c, g0) {

    ar: g => g < g0 ? c.n : g < 100 ? (at(c.ar0, g - g0) ?? 0) : (at(c.arb, ((g - 100) / 10) | 0) ?? 0),

}

  const c = 50 / coin, ng = add + SP.yame_hosei_g, ag = ty / SP.at_net_gain;
  const net = ty - c * ng, tin = SP.bet * (ng + ag);
  return { add, ty, ev: net, roi: tin > 0 ? 1 + net / tin : NaN };
}
const fmtN = n => n >= 1_000_000 ? Math.round(n / 10000) + '万' : n >= 10000 ? (n / 10000).toFixed(1) + '万' : n.toLocaleString();
function show(aim, key) {
  const isAsa = aim === 'asa';
  const cell = isAsa ? D.asaichi : D.cells[key];
  const out = document.getElementById('out'); out.hidden = false;
  if (!cell) { document.getElementById('tEV').innerHTML = ''; document.getElementById('ninfo').textContent = 'この条件のデータがありません'; return; }
  const cv = curveOf(cell, isAsa ? 0 : D.g0), mk = survival(cv), coin = isAsa ? D.coin_asa : SP.coin_mochi_odd;
  const bins = [isAsa ? 0 : 37]; for (let g = 50; g <= 1450; g += 50) bins.push(g);
  let t = '<thead><tr><th>着席G</th><th>サンプル数</th><th>初当り確率</th><th>RUSH_TY</th><th>期待値</th><th>出玉率</th></tr></thead><tbody>', few = false;
  for (const g of bins) {
    const r = evalRaw(cv, mk, g, coin), nAt = cv.ar(Math.min(GMAX, g + EX));
    if (!r || nAt < 1 || !isFinite(r.ty)) { t += `<tr><td class="lab">${g}</td><td class="ref">${fmtN(nAt)}</td><td class="ref" colspan="4">サンプルなし</td></tr>`; continue; }
    const f = nAt < RAW_FEW; if (f) few = true;
    const cls = r.ev >= 0 ? 'plus' : 'minus';
    t += `<tr><td class="lab">${g}</td><td class="ref">${fmtN(nAt)}${f ? '※' : ''}</td><td>1/${r.add.toFixed(0)}</td><td>${r.ty.toFixed(0)}</td><td class="${cls}">${r.ev >= 0 ? '+' : ''}${Math.round(r.ev * YEN).toLocaleString()}</td><td class="${cls}">${(r.roi * 100).toFixed(1)}%</td></tr>`;
  }
  document.getElementById('tEV').innerHTML = t + '</tbody>';
  document.getElementById('ninfo').textContent = `この条件の解析サンプル: ${cell.n.toLocaleString()} 件`;
  document.getElementById('note').innerHTML =
    `<b>生データ</b>: 選んだ狙い方の条件に当てはまるサンプルだけで、初当り確率は Kaplan-Meier、RUSH_TY はそのG以降の当選の RUSH 完走までの平均獲得。設定推測・倍率・穴埋めは一切使っていません。`
    + `サンプル数は、その条件で着席G+${EX}まで当たらずに到達した数(着席直後の${EX}Gは除外し投資に計上)。`
    + `コイン持ちは ${isAsa ? `推定設定6の実測値 ${coin}G/50枚(朝イチ)` : `奇数設定値 ${coin}G/50枚`}、MAXBET補正 ${SP.max_bet_corr}枚、ヤメ補正 ${SP.yame_hosei_g}G、期待値は ${YEN}円/枚。`
    + (few ? `<br><b>※</b> = 到達サンプルが${RAW_FEW}未満の行。ぶれが大きいので参考値です。` : '')
    + (aim === 'yuri' && state.cut === 'cut' ? `<br><b>当日切断</b>: 最低有利区間差枚数 700〜1,100 枚は 当日未切断の 1,000〜1,400 枚、1,100〜1,500 枚は 1,400〜1,800 枚と同じ表を出しています。` : '');
}
document.getElementById('how').innerHTML = `<b>条件の定義</b><br>
・連数 = AT のセット数(赤7でなく、獲得 42 枚超の当選の数)。天井 = 当選 G ${TEN} 以上。前回当選G = 前回の AT を引いたときの G。<br>
・切断後(前回) = 前々回終了時の当日差枚 +${D.meta.cut_pp_hi.toLocaleString()} 枚以下 かつ 前回終了時 +${D.meta.cut_p_lo.toLocaleString()} 枚以上。切断後(前々回) = 前々回終了時 +${D.meta.cut_p_lo.toLocaleString()} 枚以上 かつ 前々回が当日の最高点。「4連以上 or 切断後」「単発 or 2連」「3連」は赤7なし・天井でない塊。<br>
・当日差枚 = Σ獲得 − 1.62枚/G × Σ通常G(ホール換算)。当日未切断 = 前回終了時までの当日最高点が +${D.meta.nocut_max.toLocaleString()} 枚未満。有利区間差枚数 = 前回終了時の当日差枚。<br>
・朝イチ = 当日最初の当り待ち(0G から)。朝2 = 前回が当日最初の当り。<br>
・${D.meta.fix_note}`;
render();
</script>
